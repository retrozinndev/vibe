name: "Build and Upload"

on:
  push:
    branches: [ "main" ]
    paths: [ "src/**", ".github/workflows/**", "package.json" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "src/**", ".github/workflows/**", "package.json" ]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          submodules: "recursive"
          path: "."

      - name: "Setup bun"
        uses: "oven-sh/setup-bun@v2"
        with:
          version: "latest"
          run_install: false
      
      - name: "Install dependencies"
        run: |
          sudo apt update -y
          sudo apt install -y --fix-broken libglib2.0-dev gobject-introspection libgirepository1.0-dev build-essential gjs
          bun install --trust

      - name: "Build project"
        run: "bun run build -rg ./gresource"

      - name: "Upload"
        uses: "actions/upload-artifact@v7"
        with:
          name: "vibe"
          path: "build/"
